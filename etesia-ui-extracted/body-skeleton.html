<style>
  :root {
    --paper: #f3eee3;
    --paper-2: #ebe5d5;
    --rule: #1d1a14;
    --ink: #14110b;
    --ink-2: #4a4537;
    --ink-3: #807a68;
    --accent: #b14820;        /* burnt vermillion */
    --accent-2: #1f5e4a;      /* archival green */
    --warn: #9a5d10;
    --good: #1f5e4a;
    --bad: #a31f1f;
    --grid: rgba(29,26,20,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: 0 0;
    min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; }
  .uc { text-transform: uppercase; letter-spacing: 0.14em; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

  #root { max-width: 1360px; margin: 0 auto; padding: 28px 36px 96px; }

  /* ============ Masthead ============ */
  .masthead {
    border-top: 4px double var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 18px 0 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 16px;
  }
  .masthead .left { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .masthead .left .row { display: flex; gap: 18px; }
  .masthead .center { text-align: center; }
  .masthead .center .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.32em; color: var(--ink-2); }
  .masthead .center h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 0.95;
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }
  .masthead .center .sub { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--ink-2); font-size: 18px; }
  .masthead .right { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .masthead .right .vol { font-size: 10px; letter-spacing: 0.2em; }

  /* ============ Section bar ============ */
  .section-bar {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
  }
  .section-bar .num-mark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--rule);
    color: var(--paper);
    padding: 3px 8px;
    letter-spacing: 0.2em;
  }
  .section-bar h2 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .section-bar .meta { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .section-bar .meta.locked { color: var(--ink-3); }

  /* ============ Buttons ============ */
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px 18px;
    background: var(--rule);
    color: var(--paper);
    border: 1px solid var(--rule);
    cursor: pointer;
    transition: transform .08s ease, background .12s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--rule); }
  .btn.ghost:hover { background: var(--rule); color: var(--paper); }
  .btn.lg { padding: 14px 24px; font-size: 13px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; background: var(--rule); border-color: var(--rule); }
  .btn:disabled:hover { background: var(--rule); color: var(--paper); }
  .btn .dot { width: 7px; height: 7px; background: currentColor; border-radius: 50%; }

  /* ============ Connect screen ============ */
  .connect-stage {
    margin-top: 44px;
    border: 1px solid var(--rule);
    background: var(--paper-2);
    padding: 52px 48px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: center;
    position: relative;
  }
  .connect-stage::before {
    content: '';
    position: absolute; inset: 6px;
    border: 1px solid var(--rule);
    pointer-events: none;
  }
  .connect-stage h3 {
    font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 48px;
    margin: 14px 0 12px; letter-spacing: -0.01em;
  }
  .connect-stage h3 em { color: var(--accent); font-style: italic; }
  .connect-stage p { font-size: 15px; color: var(--ink-2); max-width: 46ch; }
  .stamp {
    border: 2px solid var(--accent); color: var(--accent);
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.24em;
    text-transform: uppercase; padding: 5px 10px; display: inline-block; transform: rotate(-2deg);
  }
  .wallets {
    display: grid; gap: 10px;
  }
  .wallet-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px;
    border: 1px solid var(--rule);
    background: var(--paper);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .wallet-card:hover { background: var(--rule); color: var(--paper); }
  .wallet-card .nm { font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 15px; }
  .wallet-card .ar { font-family: 'IBM Plex Mono', monospace; font-size: 18px; }

  /* ============ Coin grid ============ */
  .coin-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-top: 18px;
  }
  .coin-card {
    background: var(--paper);
    padding: 18px 18px 16px;
    position: relative;
    cursor: pointer;
    transition: background .12s ease;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 188px;
  }
  .coin-card:hover { background: var(--paper-2); }
  .coin-card.selected { background: #1d1a14; color: var(--paper); }
  .coin-card.selected .label, .coin-card.selected .stat-label { color: rgba(243,238,227,0.6); }
  .coin-card.selected .bar-track { background: rgba(243,238,227,0.2); }
  .coin-card .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .coin-card .glyph {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Instrument Serif', serif; font-size: 22px;
    color: var(--paper);
    flex-shrink: 0;
  }
  .coin-card .check {
    width: 22px; height: 22px;
    border: 1.5px solid currentColor;
    display: grid; place-items: center;
    color: var(--ink-2);
  }
  .coin-card.selected .check { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .coin-card .name-line .tk { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.04em; }
  .coin-card .name-line .nm { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 14px; color: var(--ink-2); }
  .coin-card.selected .name-line .nm { color: rgba(243,238,227,0.7); }
  .coin-card .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: auto; }
  .coin-card .stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); }
  .coin-card .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; }
  .coin-card .bar-track { height: 3px; background: rgba(29,26,20,0.12); margin-top: 4px; position: relative; }
  .coin-card .bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); }
  .corr-pill {
    position: absolute; top: 12px; right: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    padding: 3px 7px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    color: var(--ink);
    letter-spacing: 0.06em;
  }
  .coin-card.selected .corr-pill { background: transparent; border-color: rgba(243,238,227,0.4); color: var(--paper); }
  .corr-pill.good { color: var(--good); border-color: var(--good); }
  .corr-pill.warn { color: var(--warn); border-color: var(--warn); }
  .corr-pill.bad { color: var(--bad); border-color: var(--bad); }
  .coin-card.selected .corr-pill.good { color: #7ad8b8; border-color: #7ad8b8; }
  .coin-card.selected .corr-pill.warn { color: #e3a657; border-color: #e3a657; }
  .coin-card.selected .corr-pill.bad { color: #f0888a; border-color: #f0888a; }

  /* ============ Two-column layout ============ */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 24px;
    margin-top: 18px;
  }
  .sidecar {
    border: 1px solid var(--rule);
    background: var(--paper-2);
    padding: 20px;
    position: sticky;
    top: 16px;
    align-self: start;
  }
  .sidecar h4 {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.24em;
    text-transform: uppercase; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--rule);
  }
  .sidecar .empty { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--ink-2); font-size: 16px; padding: 20px 0; text-align: center; }
  .basket-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px dashed rgba(29,26,20,0.18);
  }
  .basket-row:last-child { border-bottom: none; }
  .basket-row .gl { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); font-family: 'Instrument Serif', serif; font-size: 13px; }
  .basket-row .tk { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; }
  .basket-row .rm { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--ink-3); cursor: pointer; background: none; border: none; padding: 0 4px; }
  .basket-row .rm:hover { color: var(--accent); }
  .sidecar .metrics { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); display: grid; gap: 8px; }
  .sidecar .metrics .row { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .sidecar .metrics .row .lbl { color: var(--ink-2); }
  .sidecar .metrics .row .val { font-weight: 500; }

  /* ============ Step 3 — funding ============ */
  .funding-panel {
    margin-top: 18px;
    border: 1px solid var(--rule);
    padding: 24px;
    background: var(--paper-2);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .funding-panel .col h5 {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-2);
    margin: 0 0 12px;
  }
  .holding-list { display: grid; gap: 6px; }
  .holding-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 14px;
    border: 1px solid var(--rule);
    background: var(--paper);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .holding-row:hover { background: var(--paper-2); }
  .holding-row.selected { background: var(--rule); color: var(--paper); }
  .holding-row.selected .sub { color: rgba(243,238,227,0.7); }
  .holding-row .gl { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); font-family: 'Instrument Serif', serif; font-size: 14px; }
  .holding-row .tk { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px; }
  .holding-row .sub { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 13px; color: var(--ink-2); }
  .holding-row .amt { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .holding-row .usd { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .holding-row.selected .usd { color: rgba(243,238,227,0.7); }

  .amount-block { display: grid; gap: 14px; }
  .amount-input-wrap {
    border: 1px solid var(--rule);
    background: var(--paper);
    padding: 16px 18px;
    display: flex; align-items: baseline; gap: 12px;
  }
  .amount-input-wrap .pre { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); letter-spacing: 0.2em; }
  .amount-input-wrap input {
    border: none; background: transparent; outline: none;
    font-family: 'Instrument Serif', serif; font-size: 44px;
    width: 100%; color: var(--ink); padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .amount-input-wrap .unit { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-2); }
  .amount-input-wrap .usd-conv { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .quick-amounts { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick-amounts .qa {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 7px 11px; border: 1px solid var(--rule); background: transparent;
    cursor: pointer; letter-spacing: 0.06em;
  }
  .quick-amounts .qa:hover, .quick-amounts .qa.active { background: var(--rule); color: var(--paper); }
  .build-cta {
    margin-top: 28px;
    border-top: 1px solid var(--rule);
    padding-top: 20px;
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: center;
    gap: 18px;
  }
  .build-cta .note { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--ink-2); font-size: 16px; max-width: 56ch; }

  /* ============ Allocation result ============ */
  .alloc-stage { margin-top: 18px; border: 1px solid var(--rule); background: var(--paper); padding: 28px; }
  .alloc-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; margin-bottom: 22px; }
  .alloc-header h3 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 36px; margin: 0; letter-spacing: -0.01em; }
  .alloc-header .ts { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }
  .alloc-bar { display: flex; width: 100%; height: 60px; border: 1px solid var(--rule); overflow: hidden; }
  .alloc-bar .seg { display: grid; place-items: center; color: var(--paper); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; transition: flex-basis .4s ease; position: relative; }
  .alloc-bar .seg span.tk { font-size: 11px; letter-spacing: 0.08em; }
  .alloc-bar .seg span.pct { font-family: 'Instrument Serif', serif; font-size: 18px; font-style: italic; }
  .alloc-bar .seg.thin span.tk, .alloc-bar .seg.thin span.pct { display: none; }
  .alloc-table {
    margin-top: 22px;
    display: grid;
    gap: 1px;
    background: rgba(29,26,20,0.15);
    border: 1px solid var(--rule);
  }
  .alloc-row {
    background: var(--paper);
    display: grid;
    grid-template-columns: 40px 1fr 100px 100px 100px 1fr;
    gap: 16px;
    padding: 12px 16px;
    align-items: center;
  }
  .alloc-row.head {
    background: var(--paper-2);
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-2);
  }
  .alloc-row .gl { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); font-family: 'Instrument Serif', serif; font-size: 14px; }
  .alloc-row .nm .tk { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px; }
  .alloc-row .nm .full { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 13px; color: var(--ink-2); }
  .alloc-row .pct { font-family: 'Instrument Serif', serif; font-size: 28px; font-weight: 400; }
  .alloc-row .num { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .alloc-row .vol-bar { height: 4px; background: rgba(29,26,20,0.1); position: relative; }
  .alloc-row .vol-bar > div { position: absolute; left: 0; top: 0; height: 100%; }

  .trade-cta {
    margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 22px;
    display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center;
  }
  .trade-cta .meta-blob { display: grid; grid-template-columns: repeat(4, auto); gap: 28px; font-family: 'IBM Plex Mono', monospace; }
  .trade-cta .meta-blob .lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
  .trade-cta .meta-blob .val { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .trade-cta .meta-blob .val.acc { color: var(--accent); }
  .trade-cta .meta-blob .val.good { color: var(--good); }

  /* ============ Execution overlay ============ */
  .exec-overlay {
    position: fixed; inset: 0; background: rgba(20,17,11,0.86);
    display: grid; place-items: center; z-index: 50;
    backdrop-filter: blur(4px);
  }
  .exec-card {
    background: var(--paper); border: 1px solid var(--rule); padding: 36px;
    width: min(640px, 92vw);
    position: relative;
  }
  .exec-card::before {
    content: ''; position: absolute; inset: 6px; border: 1px solid var(--rule); pointer-events: none;
  }
  .exec-card h3 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .exec-card .sub { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--ink-2); margin-bottom: 22px; }
  .exec-list { display: grid; gap: 8px; }
  .exec-step {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px;
    padding: 12px 14px; border: 1px solid var(--rule); background: var(--paper-2);
    align-items: center;
  }
  .exec-step .ix { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); letter-spacing: 0.2em; }
  .exec-step .desc { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
  .exec-step .desc .tk { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .exec-step .stat { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
  .exec-step.pending .stat { color: var(--ink-3); }
  .exec-step.running .stat { color: var(--warn); }
  .exec-step.running { background: var(--paper); }
  .exec-step.done .stat { color: var(--good); }
  .exec-close { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; }
  .exec-close .receipt { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); }

  /* misc */
  .spin {
    display: inline-block; width: 10px; height: 10px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .locked .coin-grid, .locked .funding-panel { opacity: 0.45; pointer-events: none; filter: grayscale(0.4); }

  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  .ticker {
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    margin-top: 22px; padding: 8px 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    display: flex; gap: 36px; overflow: hidden; white-space: nowrap;
    color: var(--ink-2);
  }
  .ticker .lane { display: flex; gap: 36px; animation: marquee 60s linear infinite; }
  .ticker .lane .it strong { color: var(--ink); }
  .ticker .lane .up { color: var(--good); }
  .ticker .lane .dn { color: var(--bad); }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
